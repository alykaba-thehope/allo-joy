; ── Transports ───────────────────────────────────────────────────────────────

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; ── ARI (Asterisk REST Interface) ─────────────────────────────────────────────
; Configuré dans http.conf + ari.conf

; ── Trunk opérateur (SIP trunk vers Orange/MTN Guinée) ───────────────────────
; Remplacer avec les vraies credentials de l'opérateur

[trunk_operator]
type = registration
transport = transport-udp
outbound_auth = trunk_operator_auth
server_uri = sip:VOTRE_REGISTRAR_OPERATEUR
client_uri = sip:VOTRE_NUMERO@VOTRE_REGISTRAR_OPERATEUR
retry_interval = 60

[trunk_operator_auth]
type = auth
auth_type = userpass
username = VOTRE_USERNAME_SIP
password = VOTRE_PASSWORD_SIP

[trunk_operator_aor]
type = aor
contact = sip:VOTRE_REGISTRAR_OPERATEUR

[trunk_operator_endpoint]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw,alaw,g729
outbound_auth = trunk_operator_auth
aors = trunk_operator_aor

; ── Agents softphone (WebRTC via agent-web) ───────────────────────────────────
; Un endpoint PJSIP par agent — en prod ces credentials viennent des SSM params

[agent_template](!)
type = endpoint
transport = transport-tcp
context = from-agents
disallow = all
allow = ulaw,alaw,opus
dtmf_mode = rfc4733
direct_media = no
ice_support = yes
use_avpf = yes
rtcp_mux = yes

[auth_template](!)
type = auth
auth_type = userpass

[aor_template](!)
type = aor
max_contacts = 2
remove_existing = yes

; Agents (ajoutés dynamiquement via provisioning script en prod)
[agent001](agent_template)
auth = auth_agent001
aors = aor_agent001

[auth_agent001](auth_template)
username = agent001
password = AGENT001_PASSWORD

[aor_agent001](aor_template)
