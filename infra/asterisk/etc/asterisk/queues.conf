; ── File d'attente agents AlloJoy ────────────────────────────────────────────

[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
log-membername-as-agent-code = no

[agents_queue]
; Stratégie : leastrecent = agent ayant répondu le plus tôt
strategy = leastrecent

; Annonces
announce = allojoy/annonce-attente
announce-frequency = 60
announce-holdtime = yes
announce-position = yes

; Timings
timeout = 20            ; sonner chaque agent 20s avant de passer au suivant
retry = 5               ; attendre 5s avant de re-tenter
wrapuptime = 10         ; pause de 10s après raccrochage pour notes agent
maxlen = 15             ; max 15 appelants en attente
servicelevel = 60       ; objectif: répondre en 60s (KPI)

; Musique d'attente
musicclass = allojoy

; Rejoindre même si vide (on attend l'arrivée d'un agent)
joinempty = yes
leavewhenempty = no

; Agents statiques (login/logout dynamique via AMI)
; En prod : agents se loguent via agent-web (AMI login action)
member => PJSIP/agent001
