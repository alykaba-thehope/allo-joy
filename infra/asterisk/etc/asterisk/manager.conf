; AMI — Asterisk Manager Interface
; Utilisé pour les login/logout d'agents depuis agent-web

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
webenabled = no

; Compte pour l'API AlloJoy
[allojoy_api]
secret = ${AMI_SECRET}
read = system,call,log,verbose,command,agent,originate
write = system,call,log,verbose,command,agent,originate
deny = 0.0.0.0/0.0.0.0
permit = 172.16.0.0/12     ; plage Docker interne
permit = 10.0.0.0/8
permit = 127.0.0.1/255.0.0.0
