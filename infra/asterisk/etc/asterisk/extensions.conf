; ── Dialplan AlloJoy 3030 ────────────────────────────────────────────────────
;
; Flux d'appel :
;   Citoyen appelle 3030 → from-trunk → allojoy-ivr
;   IVR accueille en français, propose langues
;   Appel transféré à la file d'attente agents
;   AGI notifie l'API (call:incoming via webhook)
;   À la fin, AGI notifie l'API (call:ended)

[globals]
API_URL = http://api:3000
ALLOJOY_QUEUE = agents_queue
RECORDING_DIR = /var/spool/asterisk/monitor

; ── Appels entrants depuis l'opérateur ───────────────────────────────────────

[from-trunk]
exten => _X.,1,NoOp(Appel entrant: ${CALLERID(num)})
 same => n,Set(CITIZEN_PHONE=${CALLERID(num)})
 same => n,Set(CALL_ID=${UNIQUEID})
 same => n,Goto(allojoy-ivr,s,1)

; ── IVR AlloJoy ──────────────────────────────────────────────────────────────

[allojoy-ivr]
exten => s,1,Answer()
 same => n,Wait(0.5)
 same => n,AGI(allojoy_call_start.py,${CALL_ID},${CITIZEN_PHONE})
 same => n,Set(LANGUE=fr)
 ; Message d'accueil
 same => n,Background(allojoy/bienvenue)
 same => n,WaitExten(3)

; Choix de langue
exten => 1,1,Set(LANGUE=fr)
 same => n,Goto(allojoy-queue,s,1)

exten => 2,1,Set(LANGUE=pular)
 same => n,Goto(allojoy-queue,s,1)

exten => 3,1,Set(LANGUE=malinke)
 same => n,Goto(allojoy-queue,s,1)

exten => 4,1,Set(LANGUE=soussou)
 same => n,Goto(allojoy-queue,s,1)

; Urgences directes touche 0
exten => 0,1,Playback(allojoy/urgences)
 same => n,Hangup()

; Timeout → français par défaut
exten => t,1,Set(LANGUE=fr)
 same => n,Goto(allojoy-queue,s,1)

exten => i,1,Playback(allojoy/choix-invalide)
 same => n,Goto(allojoy-ivr,s,1)

; ── File d'attente agents ─────────────────────────────────────────────────────

[allojoy-queue]
exten => s,1,NoOp(Mise en attente: ${CITIZEN_PHONE} lang=${LANGUE})
 ; Musique d'attente + annonce position
 same => n,Set(QUEUE_START=${EPOCH})
 same => n,Queue(${ALLOJOY_QUEUE},t,,,120)        ; timeout 2 min
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?timeout)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?full)
 ; Agent a décroché — enregistrement
 same => n,Set(REC_FILE=${RECORDING_DIR}/${CALL_ID})
 same => n,MixMonitor(${REC_FILE}.wav,b)
 same => n,NoOp(Agent ${AGENT} en communication)
 same => n,Goto(end,1)

exten => timeout,1,Playback(allojoy/tous-agents-occupes)
 same => n,Goto(callback,1)

exten => full,1,Playback(allojoy/service-complet)
 same => n,Goto(callback,1)

; Proposer un rappel si file pleine
exten => callback,1,Background(allojoy/rappel-proposé)
 same => n,WaitExten(5)
exten => 1,1,NoOp(Rappel demandé par ${CITIZEN_PHONE})
 same => n,AGI(allojoy_callback_request.py,${CALL_ID},${CITIZEN_PHONE})
 same => n,Playback(allojoy/rappel-enregistre)
 same => n,Hangup()
exten => t,1,Hangup()

exten => end,1,NoOp(Fin appel ${CALL_ID})
 same => n,Hangup()

; ── Raccroché (h) — toujours exécuté ─────────────────────────────────────────

[allojoy-ivr]
exten => h,1,AGI(allojoy_call_end.py,${CALL_ID},${EPOCH})

[allojoy-queue]
exten => h,1,AGI(allojoy_call_end.py,${CALL_ID},${EPOCH})

; ── Appels sortants agents (clic-to-call) ────────────────────────────────────

[from-agents]
exten => _0X.,1,NoOp(Appel sortant agent: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk_operator_endpoint,60)
 same => n,Hangup()

; Numéros d'urgence directs
exten => 442,1,Dial(PJSIP/442@trunk_operator_endpoint,60)  ; SAMU
exten => 117,1,Dial(PJSIP/117@trunk_operator_endpoint,60)  ; Police
exten => 18,1,Dial(PJSIP/18@trunk_operator_endpoint,60)    ; Pompiers

; ── ARI stasis app (pour l'intégration avancée) ──────────────────────────────

[ari-context]
exten => _X.,1,Stasis(allojoy-ari)
 same => n,Hangup()
