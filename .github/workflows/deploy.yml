name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION:     af-south-1
  ECR_REPOSITORY: allojoy-prod-api
  ECS_CLUSTER:    allojoy-prod-cluster
  ECS_SERVICE:    allojoy-prod-api
  CONTAINER_NAME: allojoy-api

jobs:
  # ── Typecheck avant déploiement ───────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build -w @allo-joy/types
      - run: npm run db:generate -w @allo-joy/api
      - run: npm run typecheck -w @allo-joy/api
      - run: npm run typecheck -w @allo-joy/agent-web
      - run: npm run typecheck -w @allo-joy/supervisor-web
      - run: npm run typecheck -w @allo-joy/provider-web

  # ── Build & Push image Docker → ECR ──────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: typecheck
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "624782990005"
          region: af-south-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx build \
            --file apps/api/Dockerfile \
            --tag "$IMAGE" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --cache-from type=registry,ref="$ECR_REGISTRY/$ECR_REPOSITORY:cache" \
            --cache-to   type=registry,ref="$ECR_REGISTRY/$ECR_REPOSITORY:cache",mode=max \
            --push \
            .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # ── Deploy sur ECS Fargate ────────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ needs.build-push.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ env.ECS_SERVICE }}
          cluster:                    ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          region:                     ${{ env.AWS_REGION }}

  # ── Build & Deploy apps web → S3 + CloudFront ────────────────────────────────
  deploy-web:
    name: Deploy Web Apps
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build all web apps
        env:
          VITE_API_URL: http://allojoy-prod-alb-1888560271.af-south-1.elb.amazonaws.com
        run: |
          npm run build -w @allo-joy/agent-web
          npm run build -w @allo-joy/supervisor-web
          npm run build -w @allo-joy/provider-web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy agent-web → S3
        run: |
          aws s3 sync apps/agent-web/dist \
            s3://${{ secrets.S3_AGENT }} \
            --region ${{ env.AWS_REGION }} \
            --delete --cache-control "max-age=31536000,immutable"
          aws s3 cp apps/agent-web/dist/index.html \
            s3://${{ secrets.S3_AGENT }}/index.html \
            --region ${{ env.AWS_REGION }} \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Deploy supervisor-web → S3
        run: |
          aws s3 sync apps/supervisor-web/dist \
            s3://${{ secrets.S3_SUPERVISOR }} \
            --region ${{ env.AWS_REGION }} \
            --delete --cache-control "max-age=31536000,immutable"
          aws s3 cp apps/supervisor-web/dist/index.html \
            s3://${{ secrets.S3_SUPERVISOR }}/index.html \
            --region ${{ env.AWS_REGION }} \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Deploy provider-web → S3
        run: |
          aws s3 sync apps/provider-web/dist \
            s3://${{ secrets.S3_PROVIDER }} \
            --region ${{ env.AWS_REGION }} \
            --delete --cache-control "max-age=31536000,immutable"
          aws s3 cp apps/provider-web/dist/index.html \
            s3://${{ secrets.S3_PROVIDER }}/index.html \
            --region ${{ env.AWS_REGION }} \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront caches
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_AGENT }}      --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_SUPERVISOR }}  --paths "/*"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_PROVIDER }}    --paths "/*"
