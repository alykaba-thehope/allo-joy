name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Typecheck + Lint ─────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck — API
        run: npm run typecheck -w @allo-joy/api

      - name: Typecheck — agent-web
        run: npm run typecheck -w @allo-joy/agent-web

      - name: Typecheck — supervisor-web
        run: npm run typecheck -w @allo-joy/supervisor-web

      - name: Typecheck — provider-web
        run: npm run typecheck -w @allo-joy/provider-web

  # ── Tests unitaires ───────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER:     allojoy
          POSTGRES_PASSWORD: allojoy_test
          POSTGRES_DB:       allojoy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://allojoy:allojoy_test@localhost:5432/allojoy_test
      REDIS_URL:    redis://localhost:6379
      JWT_SECRET:   test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Prisma generate
        run: npm run db:generate -w @allo-joy/api

      - name: Run tests with coverage
        run: npm run test:coverage -w @allo-joy/api

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: apps/api/coverage/

  # ── Build Docker ──────────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    # Ne builder le Docker que sur develop/main (pas chaque PR commit)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — validation seulement)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: allojoy-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
